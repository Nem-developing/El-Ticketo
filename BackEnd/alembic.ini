# Configuration Alembic (création de migrations) :
#   .venv/bin/alembic revision --autogenerate -m "description"
# L'URL de la base est lue depuis DATABASE_URL / DB_* (voir app/config.py).
# Les migrations sont appliquées automatiquement au démarrage de l'API.

[alembic]
script_location = %(here)s/app/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
